<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمصة سَمر | تواصل معنا</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">☕ محمصة سَمر</div>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>

    <section class="container">
        <h2 class="section-title">يسعدنا تواصلك معنا</h2>
        <form id="contactForm" class="contact-form">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" placeholder="أدخل اسمك هنا" required>

            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" placeholder="example@email.com" required>

            <label for="message">رسالتك أو طلبك:</label>
            <textarea id="message" rows="4" placeholder="اكتب رسالتك هنا..." required></textarea>

            <button type="submit" class="btn">إرسال الرسالة</button>
        </form>
        <p id="formFeedback" class="feedback-msg"></p>
    </section>

    <footer>
        <p>محمصة سَمر للقهوة المختصة</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
